<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm</title>

    <link rel="stylesheet" href="./index.css">
</head>

<body>

    <header>
        <button>Login</button>
        <button>Planos</button>
        <button>Suporte</button>
    </header>

    <main>

        <img src="./logo1.png" alt="Logo Rhythm">

        <h1>Rhythm</h1>

        <p>Sua música, seu ritmo.</p>

        <form>

            <label for="nome">Nome</label>
            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                required
            >

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
            >

            <a href="./selecao.html" id="btn-cadastro">
                CADASTRAR
            </a>

        </form>

    </main>

</body>

</html>
